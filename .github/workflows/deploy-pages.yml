# Builds the standalone site and publishes it to GitHub Pages on every push to main, and every
# three hours so the main menu's feed carries the latest official announcements and bills
# about spending and taxes (scripts/fetch-news.mjs and scripts/fetch-bills.mjs; a failed fetch
# keeps what is in the repo).
# The standalone build refreshes the national debt and the latest monthly Treasury
# figures live in each visitor's browser; everything else uses the data in src/data/.
#
# Action versions run natively on Node.js 24 (the Node 20 majors print deprecation warnings,
# such as DEP0040 for `punycode`, when the runner forces them onto Node 24).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the latest official news
        run: node scripts/fetch-news.mjs || echo "News fetch failed; building with the news already in the repo."
      # The feed's bills: Congress.gov's API, with the free api.data.gov key kept as the repository
      # secret CONGRESS_API_KEY (Settings → Secrets and variables → Actions). Without it (or if
      # Congress.gov can't be reached), the bills already in the repo are used; the shared
      # DEMO_KEY is never used here.
      - name: Fetch spending and tax bills for the feed
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: node scripts/fetch-bills.mjs || echo "Bills fetch failed; building with the bills already in the repo."
      - name: Fetch the Treasury's latest daily figures
        run: node scripts/fetch-dts.mjs || echo "Treasury fetch failed; building with the figures already in the repo."
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # GitHub's Pages service sometimes stalls ("updating_pages") or answers with a server
      # error. Wait the full 10 minutes it allows, and if it fails, pause a minute and try once more.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
